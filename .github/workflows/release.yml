name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          if echo "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import --yes --pinentry-mode loopback
          else
            echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import --yes --pinentry-mode loopback
          fi
          gpg --list-secret-keys --keyid-format LONG

      - name: Resolve release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Unable to determine release version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}

      - name: Set release version
        run: |
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false
          sed -i "s|<tag>HEAD</tag>|<tag>v${VERSION}</tag>|" pom.xml

      - name: Verify and publish to Maven Central
        run: ./mvnw -B clean verify deploy -Prelease
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
